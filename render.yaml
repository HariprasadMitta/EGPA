# Render Blueprint - hosts the real AI Gateway (LiteLLM Proxy) with a
# public URL, so the deployed Next.js app (on Vercel) can reach it instead
# of the local-only http://localhost:4000 this app used during development.
#
# One-time setup: create a free account at render.com, then "New +" ->
# "Blueprint" -> connect this GitHub repo. Render reads this file
# automatically and provisions the service below, prompting you to fill in
# the `sync: false` secret values (same real values already in your local
# .env.local - never committed here). No other configuration needed.
services:
  - type: web
    name: momentum-litellm-gateway
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: litellm --config litellm-config.yaml --port $PORT --host 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      # Real provider keys - the same ones the local .venv-litellm process
      # reads from .env.local, now consumed by this hosted process instead.
      # The Next.js app itself never holds these, on Vercel or locally.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # This proxy's own admin credential (mints the app's scoped virtual
      # key via /key/generate - see the one-time setup note in
      # src/lib/agentModel.ts). Generate a new one for the hosted instance
      # rather than reusing the local LITELLM_MASTER_KEY value.
      - key: LITELLM_MASTER_KEY
        sync: false
      # LiteLLM's own database (DB mode - real virtual-key issuance/spend
      # tracking) - the same separate Neon project as LITELLM_DATABASE_URL
      # in .env.local, reachable from anywhere, not just localhost.
      - key: LITELLM_DATABASE_URL
        sync: false
      # Real gap hit locally the first time this database was provisioned
      # (see plan file / commit history): LiteLLM's own bundled migration
      # history has a real duplicate-type bug it self-heals for on a fresh
      # DB, which can hang for minutes on every cold start otherwise.
      - key: DISABLE_SCHEMA_UPDATE
        value: "true"
